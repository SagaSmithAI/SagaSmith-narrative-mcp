[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-narrative-mcp"
version = "0.1.0"
description = "System-neutral authoritative long-form narrative MCP for SagaSmith"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SagaSmithAI" }]
dependencies = [
    "jsonschema>=4.23.0,<5.0.0",
    "mcp>=1.26.0,<2.0.0",
    "sagasmith-core>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0,<10.0.0", "ruff>=0.1.0"]

[project.scripts]
sagasmith-narrative-mcp = "sagasmith_narrative_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_narrative_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.uv.sources]
sagasmith-core = { path = "../sagasmith-core", editable = true }
